<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mantooth Adventures FINAL</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(145deg,#eaf8ff,#f8f0ff,#fff8e8);color:#26324a}.app{max-width:1050px;margin:auto;padding:14px}.screen{display:none}.screen.active{display:block}.hero,.card{background:#fff;border-radius:24px;padding:20px;margin-top:15px;box-shadow:0 10px 30px #26324a18}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:15px}.btn{width:100%;padding:14px;margin-top:10px;border:0;border-radius:16px;background:#6957d8;color:#fff;font-weight:900}.gold{background:#f4bd55;color:#382800}.dark{background:#26324a}.alt{background:#f0edff;color:#5146b8}.green{background:#48a980}.danger{background:#a33a4a}.back{width:auto}.big{font-size:58px}.quote,.surprise,.secret,.complete{padding:14px;border-radius:16px;margin:12px 0;font-weight:800}.quote{background:#e3f4ff}.surprise{background:#fff5d7}.secret{background:#ffe5ef}.complete{background:#dff7ee;border:2px solid #82cfae;text-align:center}.mission{border:2px dashed #ded8ff;border-radius:15px;padding:12px;margin:8px 0}.mission.done{background:#dff7ee}.check{display:flex;gap:10px;align-items:center;font-weight:800}.check input{width:24px;height:24px}.route{display:flex;gap:9px;align-items:center;overflow:auto}.stop{min-width:125px;text-align:center;padding:12px;background:#faf9ff;border-radius:16px}.locked{opacity:.35}.pin{width:100%;padding:12px;border:2px solid #e5e0ff;border-radius:14px}.toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#26324a;color:#fff;padding:13px 18px;border-radius:999px;z-index:5}.hidden{display:none}.badge{display:inline-block;padding:10px;border-radius:14px;background:#f0edff;font-weight:800}.small{font-size:13px;color:#68728a}
</style></head><body><div class="app">
<section id="home" class="screen active"><div class="hero"><div class="big">🚗✨</div><h1>The Great Beach Adventure</h1><p>August 2–7, 2026</p><button class="btn" onclick="show('choose')">Start Today's Adventure</button></div><div class="card"><h2>🗺️ Adventure Map</h2><div class="route"><div class="stop">🏠 Shelbyville</div>→<div class="stop">🎂 Hopkinsville</div>→<div id="bham" class="stop locked">🌆 Birmingham</div>→<div id="pcb" class="stop locked">🌴 Panama City</div>→<div id="orn" class="stop locked">🎄 Ornament</div></div></div></section>

<section id="choose" class="screen"><button class="btn alt back" onclick="show('home')">← Back</button><div class="grid">
<div class="card"><div class="big">🌈🦄</div><h2>Levi</h2><button class="btn" onclick="openChild('Levi')">Open Levi</button></div>
<div class="card"><div class="big">⚽🏆</div><h2>Logan</h2><button class="btn dark" onclick="openChild('Logan')">Open Logan</button></div>
<div class="card"><div class="big">🔐</div><h2>Adventure Director</h2><button class="btn gold" onclick="show('parent')">Parents Only</button></div></div></section>

<section id="levi" class="screen"><button class="btn alt back" onclick="show('choose')">← Passports</button><div id="leviContent"></div></section>
<section id="logan" class="screen"><button class="btn alt back" onclick="show('choose')">← Passports</button><div id="loganContent"></div></section>

<section id="parent" class="screen"><button class="btn alt back" onclick="lockParent();show('choose')">← Passports</button><div class="hero"><div class="big">🔐</div><h1>Parents Only</h1>
<div id="login"><input id="pin" type="password" class="pin" maxlength="4" inputmode="numeric" placeholder="Enter Parent PIN"><button class="btn gold" onclick="loginParent()">Unlock Dashboard</button></div>
<div id="controls" class="hidden"><div class="secret"><b>Jackson's secret mission:</b> Make the birthday boy smile.</div><button class="btn" onclick="nextChapter()">🔓 Unlock Next Chapter</button><button class="btn alt" onclick="prevChapter()">↩️ Previous Chapter</button><button class="btn gold" onclick="sendSurprise()">🎁 Send Surprise Mission</button><button class="btn alt" onclick="clearSurprise()">🧹 Clear Surprise</button><button class="btn dark" onclick="ornament()">🎄 Unlock Ornament Finale</button><button class="btn green" onclick="lockParent()">🔒 Lock Parent Dashboard</button><button class="btn danger" onclick="resetAll()">🧹 Clear Test Progress</button></div></div>
<div id="parentInfo" class="card hidden"><h2>Current Chapter</h2><p id="parentChapter"></p><h2>Current Surprise</h2><p id="parentSurprise">None</p></div></section>

<div id="toast" class="toast"></div></div>
<script>
const chapters=[
{name:"Jackson's 14th Birthday",lt:"Birthday Mission",gt:"Birthday Match",l:["Wish Jackson a happy 14th birthday","Make Jackson laugh","Take a funny family picture","Find something that reminds you of Jackson"],g:["Wish Jackson a happy 14th","Complete the Birthday Assist","Get a picture with Jackson","Help the family without being asked"],lb:"🎂 Birthday Hero",gb:"🎂 Birthday Champion"},
{name:"Birmingham Overnight",lt:"Rainbow Road Adventure",gt:"Away Match: Birmingham",l:["Spot something purple on the drive","Pick a road-trip song","Help carry one small thing at the hotel","Choose your favorite moment from Day 1"],g:["Spot 3 different company trucks","Pick the official team song","Help with luggage","Name the best play of Day 1"],lb:"🌆 Road Trip Explorer",gb:"🌆 Birmingham Cup"},
{name:"Panama City Beach",lt:"Magical Beach Adventure",gt:"Championship Beach Week",l:["Find your first seashell","Build something in the sand","Spot something rainbow-colored","Watch one sunset"],g:["Complete a beach scouting mission","Build a sand challenge","Create a soccer-style beach goal","Watch one sunset"],lb:"🌴 Beach Explorer",gb:"🌴 Beach MVP"},
{name:"The Ornament Promise",lt:"Magical Memory Ornament",gt:"Championship Ornament Challenge",l:["Think of your favorite memory","Find one ornament that reminds you of the trip","Choose your 2026 ornament","Take a picture with it"],g:["Pick your favorite trip memory","Find an ornament that represents it","Choose your 2026 ornament","Take a picture with it"],lb:"🎄 2026 Adventure Memory",gb:"🎄 2026 Adventure Memory"}];
const surprises=['🍦 Surprise treat mission!','📸 Take one completely unplanned family photo.','🚗 Spot a red truck before the next stop.','🎵 Everyone chooses one song for the car.','🐄 Find three cows out the window.','⭐ Find something heart-shaped.','🤝 Give someone a high five.','😂 Tell the funniest clean joke you know.'];
const state=JSON.parse(localStorage.getItem('mv3state')||'{"chapter":0,"surprise":""}');
function save(){localStorage.setItem('mv3state',JSON.stringify(state))}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');renderMap();renderParent();scrollTo(0,0)}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}
function loginParent(){if(pin.value==='2026'){login.classList.add('hidden');controls.classList.remove('hidden');parentInfo.classList.remove('hidden');toast('Parent Dashboard unlocked 🔐')}else toast('Incorrect PIN')}function lockParent(){login.classList.remove('hidden');controls.classList.add('hidden');parentInfo.classList.add('hidden');pin.value=''}
function nextChapter(){if(state.chapter<2){state.chapter++;save();toast('New chapter unlocked!');renderMap();renderParent()}else toast('Use Ornament Finale when ready')}function prevChapter(){if(state.chapter>0){state.chapter--;save();toast('Moved back one chapter');renderMap();renderParent()}else toast('Already at the beginning')}function ornament(){state.chapter=3;save();toast('Ornament Finale unlocked!');renderMap();renderParent()}
function sendSurprise(){state.surprise=surprises[Math.floor(Math.random()*surprises.length)];save();renderParent();toast('Surprise sent!')}function clearSurprise(){state.surprise='';save();renderParent();toast('Surprise cleared')}
function resetAll(){if(confirm("Clear all test progress and return to Jackson's birthday?")){Object.keys(localStorage).forEach(k=>{if(k.startsWith('mv3_'))localStorage.removeItem(k)});state.chapter=0;state.surprise='';save();renderMap();renderParent();toast('Adventure reset')}}
function renderMap(){bham.classList.toggle('locked',state.chapter<1);pcb.classList.toggle('locked',state.chapter<2);orn.classList.toggle('locked',state.chapter<3)}function renderParent(){parentChapter.textContent=chapters[state.chapter].name;parentSurprise.textContent=state.surprise||'None'}
function openChild(name){show(name==='Levi'?'levi':'logan');renderChild(name)}
function renderChild(name){const levi=name==='Levi',c=chapters[state.chapter],host=document.getElementById(levi?'leviContent':'loganContent'),items=levi?c.l:c.g;let h='<div class="hero"><div class="big">'+(levi?'🌈🦄':'⚽🏆')+'</div><h1>'+name+"'s Adventure</h1><div class='quote'>"+(levi?'Starlight: “You never know where the magic is hiding!”':'Coach Rocket: “Stay ready—the next challenge can appear anytime.”')+'</div>';if(state.surprise)h+='<div class="surprise"><b>🎁 SECRET MISSION:</b><br>'+state.surprise+'</div>';h+='</div><div class="card"><h2>'+(levi?c.lt:c.gt)+'</h2>';items.forEach((it,i)=>{const k='mv3_'+(levi?'l':'g')+'_'+state.chapter+'_'+i;h+='<div class="mission"><label class="check"><input type="checkbox" data-save="'+k+'"> '+it+'</label></div>'});h+='</div><div id="'+(levi?'leviComplete':'loganComplete')+'"></div>';host.innerHTML=h;host.querySelectorAll('[data-save]').forEach(ch=>{ch.checked=localStorage.getItem(ch.dataset.save)==='1';ch.closest('.mission').classList.toggle('done',ch.checked);ch.onchange=()=>{localStorage.setItem(ch.dataset.save,ch.checked?'1':'0');ch.closest('.mission').classList.toggle('done',ch.checked);checkComplete(name);if(ch.checked)toast('Mission complete! ⭐')}});checkComplete(name)}
function checkComplete(name){const host=document.getElementById(name==='Levi'?'leviContent':'loganContent');if(!host)return;const checks=[...host.querySelectorAll('[data-save]')],all=checks.length&&checks.every(x=>x.checked),box=document.getElementById(name==='Levi'?'leviComplete':'loganComplete'),c=chapters[state.chapter];if(all){const title=name==='Levi'?'YOU DID IT, LEVI!':'CHAPTER COMPLETE!';const line=name==='Levi'?'Starlight says: Amazing job! You completed your adventure!':'Coach Rocket says: Great job, Logan! Every mission complete. That is a win!';const badge=name==='Levi'?c.lb:c.gb;box.innerHTML='<div class="complete"><div class="big">'+(name==='Levi'?'🌈✨🦄':'🏆⚽')+'</div><h2>'+title+'</h2><p>'+line+'</p><span class="badge">'+badge+'</span><p class="small">Your next adventure is still locked until the Adventure Director reveals it.</p></div>';let key='mv3_celebrated_'+name+'_'+state.chapter;if(!localStorage.getItem(key)){localStorage.setItem(key,'1');toast(name==='Levi'?'🌈 Great job, Levi!':'🏆 Great job, Logan!')}}else box.innerHTML=''}
renderMap();renderParent();
</script></body></html>
